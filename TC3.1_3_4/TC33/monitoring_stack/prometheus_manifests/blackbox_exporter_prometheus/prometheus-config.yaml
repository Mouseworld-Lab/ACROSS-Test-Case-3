apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      - job_name: 'prometheus'
        scrape_interval: 60s
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'ml_tc33_exporter'
        scrape_interval: 30s
        static_configs:
          - targets: ['138.4.21.168:8000']

      - job_name: 'iperf3-probe1'
        metrics_path: /probe
        static_configs:
          - targets:
            - 10.0.19.10
            - 10.0.12.10
        params:
          port: ['5201']
          # Optional: enable reverse mode
          # reverse_mode: ['true']
          # Optional: enable UDP mode
          udp_mode: ['true']
          # Optional: set bitrate limit
          bitrate: ['5M']
          # Optional: set test period
          period: ['60s']
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: 138.4.21.168:9511  # The iPerf3 exporter's real hostname:port.

      - job_name: 'blackbox_probe1'
        metrics_path: /probe
        params:
          module: [icmp]  # Módulo usado para hacer ping
        static_configs:
          - targets:
            - 10.0.19.10
            - 10.0.12.10
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
