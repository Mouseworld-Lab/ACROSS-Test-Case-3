apiVersion: v1
kind: List
items:
- apiVersion: networkop.co.uk/v1beta1
  kind: Topology
  metadata:
    name: mirror
    namespace: ddos
  spec:
    links:
    - uid: 1
      peer_pod: ceos2
      local_intf: eth1
      local_ip: 14.0.0.1/24
      peer_intf: eth6
      peer_ip: 14.0.0.2/24
    - uid: 2
      peer_pod: localhost
      local_intf: eth2
      #local_ip: 
      peer_intf: mirror
- apiVersion: v1
  kind: Pod
  metadata:
    name:  mirror
    namespace: ddos
  spec:
    containers:
    - image: javi14t/internet:last
      name: pod
      command: ["sh", "-c", "sleep 2000000000000"]
      securityContext:
        privileged: true
