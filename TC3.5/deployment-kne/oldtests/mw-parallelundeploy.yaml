---
- name: Topology Undeploy
  hosts: localhost
  gather_facts: no
  vars:
    cgclients: []
    ddosclients: []

  tasks:
#--------------------------------------------Configuration---------------------------------------------------------------------------
    - name: Include client counts
      include_vars:
        file: clients_number.yaml
  
    - name: Crear cgclients
      set_fact:
        cgclients: "{{ cgclients + [{'name': 'cgclient' ~ item, 'pod': 'cgclient' ~ item}] }}"
      loop: "{{ range(1, cg_count + 1)|list }}"
    
    - name: Crear ddosclients
      set_fact:
        ddosclients: "{{ ddosclients + [{'name': 'ddosclient' ~ item, 'pod': 'ddosclient' ~ item}] }}"
      loop: "{{ range(1, ddos_count + 1)|list }}"
      
    - name: Get current date
      command: date +%Y.%m.%d_%H.%M.%S
      register: current_date
      
#--------------------------------------------Save logs---------------------------------------------------------------------------

    - name: Create logs folder with current date
      file:
        path: "~/NDT/logs_{{ current_date.stdout }}"
        state: directory
    
    - name: Copy logs folder cgclients
      shell: "kubectl -n ddos cp {{ item.pod }}:/home/cognet/logs ~/NDT/logs_{{ current_date.stdout }}/{{ item.name }}_logs"
      loop: "{{ cgclients }}"
      ignore_errors: yes
      async: 3600 
      poll: 0
      register: copylogcgclient_result 

    - name: Copy logs folder ddosclients
      shell: "kubectl -n ddos cp {{ item.pod }}:/home/cognet/logs ~/NDT/logs_{{ current_date.stdout }}/{{ item.name }}_logs"
      loop: "{{ ddosclients }}"
      ignore_errors: yes
      async: 3600 
      poll: 0
      register: copylogddosclient_result 
      
    - name: Copy logs folder cgserver
      shell: "kubectl -n ddos cp cgserver:/home/cognet/logs ~/NDT/logs_{{ current_date.stdout }}/cgserver_logs"
      ignore_errors: yes
      async: 3600 
      poll: 0
      register: copylogserver_result 
      
    - name: Copy logs folder ddosserver
      shell: "kubectl -n ddos cp ddosserver:/home/cognet/logs ~/NDT/logs_{{ current_date.stdout }}/ddosserver_logs"
      ignore_errors: yes
      async: 3600 
      poll: 0
      register: copylogddosserver_result

    - name: Stop PCAPs
      shell: "kubectl -n ddos exec {{ item.pod }} -- pkill tcpdump"
      loop:
        - { pod: "ceos1" }
        - { pod: "ceos2" }
        - { pod: "ceos3" }
        - { pod: "ceos4" }
      ignore_errors: yes
      async: 3600
      poll: 0

    - name: Copy logs folder ceos 
      shell: "kubectl -n ddos cp {{ item.pod }}:/home/{{ item.pod }}_{{ item.interface }}.pcap ~/NDT/logs_{{ current_date.stdout }}/{{ item.pod }}_{{ item.interface }}.pcap"
      loop:
        - { pod: "ceos1", interface: "eth4" }
        - { pod: "ceos1", interface: "eth1" }
        - { pod: "ceos1", interface: "eth2" }
        - { pod: "ceos1", interface: "eth3" }
        - { pod: "ceos1", interface: "eth5" }
        - { pod: "ceos1", interface: "eth6" }
        - { pod: "ceos1", interface: "eth7" }
        - { pod: "ceos1", interface: "eth8" }
        - { pod: "ceos1", interface: "eth9" }
        - { pod: "ceos1", interface: "eth10" }
        - { pod: "ceos1", interface: "eth11" }
        - { pod: "ceos1", interface: "eth12" }
        - { pod: "ceos1", interface: "eth13" }
        - { pod: "ceos1", interface: "eth14" }
        - { pod: "ceos1", interface: "eth15" }
        - { pod: "ceos1", interface: "eth16" }
        - { pod: "ceos1", interface: "eth17" }
        - { pod: "ceos1", interface: "eth18" }
        - { pod: "ceos1", interface: "eth19" }
        - { pod: "ceos1", interface: "eth20" }
        - { pod: "ceos1", interface: "eth21" }
        - { pod: "ceos1", interface: "eth22" }
        - { pod: "ceos1", interface: "eth23" }
        - { pod: "ceos2", interface: "eth4" }
        - { pod: "ceos2", interface: "eth1" }
        - { pod: "ceos2", interface: "eth2" }
        - { pod: "ceos2", interface: "eth3" }
        - { pod: "ceos3", interface: "eth4" }
        - { pod: "ceos3", interface: "eth1" }
        - { pod: "ceos3", interface: "eth2" }
        - { pod: "ceos3", interface: "eth3" }
        - { pod: "ceos4", interface: "eth1" }
        - { pod: "ceos4", interface: "eth2" }
        - { pod: "ceos4", interface: "eth3" }
        - { pod: "ceos4", interface: "eth4" }
        - { pod: "ceos4", interface: "eth5" }
        - { pod: "ceos4", interface: "eth6" }
        - { pod: "ceos4", interface: "eth7" }
        - { pod: "ceos4", interface: "eth8" }
        - { pod: "ceos4", interface: "eth9" }
        - { pod: "ceos4", interface: "eth10" }
        - { pod: "ceos4", interface: "eth11" }
        - { pod: "ceos4", interface: "eth12" }
      ignore_errors: yes
      async: 3600 
      poll: 0
      register: copylogceos_result
  

    - name: Finishing copying logs
      async_status: 
        jid: "{{ item.ansible_job_id }}"
      loop: "{{ (copylogcgclient_result.results | default([])) + (copylogddosclient_result.results | default([])) + (copylogserver_result.results | default([])) + (copylogddosserver_result.results | default([]))  + (copylogceos_result.results | default([])) }}"
      register: acrossclient_jobs
      until: acrossclient_jobs.finished
      retries: 999
      delay: 15
      ignore_errors: yes
    

#--------------------------------------------Undeploy kne---------------------------------------------------------------------------
    - name: Undeploy topology
      shell: kne delete ~/kne/examples/arista/UPM/TopologiaB5gemini.yaml 
        