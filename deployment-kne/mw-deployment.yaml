---
- name: Topology Deployment using kne
  hosts: localhost
  gather_facts: no
  tasks: 
 #--------------------------------------------Deploy kne---------------------------------------------------------------------------
 
    - name: Deploy topology
      shell: kne create ~/NDT_TC3.5/deployment-kne/10ceos_24cg_20dd_10ceos_rev4/topology-ACROSS.yaml # Configure the path where the kne topology file is

    # - name: Change daemon
    #   shell:  kubectl exec -n ddos frr13 -- sh -c "sed -i 's/^ospfd=.*/ospfd=yes/' /etc/frr/daemons"
    #   ignore_errors: yes

    # - name: Ejecutar frrinit.sh para iniciar FRR dentro del pod
    #   shell: kubectl exec -n ddos frr13 -- sudo /usr/lib/frr/frrinit.sh start
    #   ignore_errors: yes

    - name: config map
      shell: kubectl create configmap gateway2-config --from-file=/home/mw/NDT_TC3.5/deployment-kne/10ceos_24cg_20dd_10ceos_rev4/configuracion/gateway2-config.py -n ddos

    - name: Deploy gateway2
      shell: kubectl apply -f ~/NDT_TC3.5/deployment-kne/10ceos_24cg_20dd_10ceos_rev4/pod-gateway2.yaml

    - name: Wait for 20 seconds
      pause:
        seconds: 20
