---
- name: Execute task in pods
  hosts: localhost
  gather_facts: no
  vars:
    cgclients: []
    ddosclients: []

  tasks:
#--------------------------------------Configuration------------------------------------------------------------------------------------
    - name: Include client counts
      include_vars:
        file: clients_number.yaml
  
    - name: Crear cgclients
      set_fact:
        cgclients: "{{ cgclients + [{'name': 'cgclient' ~ item, 'pod': 'cgclient' ~ item}] }}"
      loop: "{{ range(1, cg_count + 1)|list }}"
    
    - name: Crear ddosclients
      set_fact:
        ddosclients: "{{ ddosclients + [{'name': 'ddosclient' ~ item, 'pod': 'ddosclient' ~ item}] }}"
      loop: "{{ range(1, ddos_count + 1)|list }}"
    
    - name: Include server IPs
      include_vars:
        file: "{{ playbook_dir }}/server_ips.yaml"

    - name: Debug loaded server IPs
      debug:
        var: ddosserver_ip

    - name: Debug loaded server IPs
      debug:
        var: cgserver_ip


#-----------------------------TCPDUMPS-------------------------------------------------------------------------------------------------

    - name: Start dumps
      shell: kubectl exec -n ddos {{ item.pod }} -- tcpdump -i {{ item.interface }} -w /home/{{ item.pod }}_{{ item.interface }}.pcap
      loop:
        - { pod: "ceos11", interface: "eth4" }
        - { pod: "ceos11", interface: "eth1" }
        - { pod: "ceos11", interface: "eth2" }
        - { pod: "ceos11", interface: "eth3" }
        - { pod: "ceos11", interface: "eth5" }
        - { pod: "ceos11", interface: "eth6" }
        - { pod: "ceos11", interface: "eth7" }
        - { pod: "ceos11", interface: "eth8" }
        - { pod: "ceos11", interface: "eth9" }
        - { pod: "ceos11", interface: "eth10" }
        - { pod: "ceos11", interface: "eth11" }
        - { pod: "ceos11", interface: "eth12" }
        - { pod: "ceos11", interface: "eth13" }
        - { pod: "ceos11", interface: "eth14" }
        - { pod: "ceos11", interface: "eth15" }
        - { pod: "ceos11", interface: "eth16" }
        - { pod: "ceos11", interface: "eth17" }
        - { pod: "ceos11", interface: "eth18" }
        - { pod: "ceos11", interface: "eth19" }
        - { pod: "ceos11", interface: "eth20" }
        - { pod: "ceos11", interface: "eth21" }
        - { pod: "ceos11", interface: "eth22" }
        - { pod: "ceos11", interface: "eth23" }
        - { pod: "ceos13", interface: "eth1" }
        - { pod: "ceos13", interface: "eth2" }
        - { pod: "ceos13", interface: "eth3" }
        - { pod: "ceos13", interface: "eth4" }
        - { pod: "ceos13", interface: "eth5" }
        - { pod: "ceos13", interface: "eth6" }
        - { pod: "ceos13", interface: "eth7" }
        - { pod: "ceos13", interface: "eth8" }
        - { pod: "ceos13", interface: "eth9" }
        - { pod: "ceos13", interface: "eth10" }
        - { pod: "ceos13", interface: "eth11" }
        - { pod: "ceos13", interface: "eth12" }
        - { pod: "ceos1", interface: "eth2" }
        - { pod: "ceos1", interface: "eth3" }
        - { pod: "ceos1", interface: "eth4" }
        - { pod: "ceos1", interface: "eth5" }
        - { pod: "ceos2", interface: "eth2" }
        - { pod: "ceos2", interface: "eth3" }
        - { pod: "ceos2", interface: "eth4" }
        - { pod: "ceos2", interface: "eth5" }
        - { pod: "ceos3", interface: "eth2" }
        - { pod: "ceos3", interface: "eth3" }
        - { pod: "ceos3", interface: "eth4" }
        - { pod: "ceos3", interface: "eth5" }
        - { pod: "ceos4", interface: "eth2" }
        - { pod: "ceos4", interface: "eth3" }
        - { pod: "ceos4", interface: "eth4" }
        - { pod: "ceos6", interface: "eth2" }
        - { pod: "ceos6", interface: "eth3" }
        - { pod: "ceos6", interface: "eth4" }
        - { pod: "ceos5", interface: "eth2" }
        - { pod: "ceos5", interface: "eth3" }
        - { pod: "ceos7", interface: "eth2" }
        - { pod: "ceos7", interface: "eth3" }
        - { pod: "ceos7", interface: "eth4" }
        - { pod: "ceos7", interface: "eth5" }
        - { pod: "ceos12", interface: "eth2" }
        - { pod: "ceos12", interface: "eth4" }
      async: 3600
      poll: 0


#---------------------------------Tasks execution---------------------------------------------------------------------------------------
    # Cglient:

    - name: Execute file_transfer
      shell: kubectl exec -n ddos cgclient1 -- python3 ACROSSfile_transfer.py https://ia800301.us.archive.org/21/items/ThePhantomoftheOpera/Phantom_of_the_Opera_512kb.mp4
      async: 3600 
      poll: 0

    - name: Execute file_transfer_scp
      shell: kubectl exec -n ddos cgclient2 -- env cgserver={{ cgserver_ip }} python3 ACROSSfile_transfer_scp.py
      async: 3600 
      poll: 0

    - name: Execute ACROSSconsuming_video.py
      shell: kubectl exec -n ddos cgclient3 -- python3 ACROSSconsuming_video.py https://www.youtube.com/watch?v=-No-226O0tg 1800 #set time and url
      async: 3600 
      poll: 0
      register: youtube_result1

    - name: Execute shorts
      shell: kubectl exec -n ddos cgclient4 -- python3 ACROSSshorts.py 1800
      async: 3600 
      poll: 0
      register: shorts_result1

    - name: Execute ACROSSclient
      shell: kubectl exec -n ddos cgclient5 -- env cgserver={{ cgserver_ip }} python3 ACROSSclient.py 100000
      async: 3600 
      poll: 0

    - name: Execute file_transfer
      shell: kubectl exec -n ddos cgclient6 -- python3 ACROSSfile_transfer.py https://ia800301.us.archive.org/21/items/ThePhantomoftheOpera/Phantom_of_the_Opera_512kb.mp4
      async: 3600 
      poll: 0

    - name: Execute file_transfer_scp
      shell: kubectl exec -n ddos cgclient7 -- env cgserver={{ cgserver_ip }} python3 ACROSSfile_transfer_scp.py
      async: 3600 
      poll: 0




    - name: Execute ACROSSrandom_walk
      shell: kubectl exec -n ddos cgclient8 --  python3 ACROSSrandom_walk.py 1800
      async: 3600 
      poll: 0 
      register: random_result1

    - name: Execute ACROSSrandom_walk
      shell: kubectl exec -n ddos cgclient9 --  python3 ACROSSrandom_walk.py 1800
      async: 3600 
      poll: 0  
      register: random_result2

    - name: Execute ACROSSrandom_walk
      shell: kubectl exec -n ddos cgclient10 --  python3 ACROSSrandom_walk.py 1800
      async: 3600 
      poll: 0 
      register: random_result3

    - name: Execute ACROSSrandom_walk
      shell: kubectl exec -n ddos cgclient11 --  python3 ACROSSrandom_walk.py 1800
      async: 3600 
      poll: 0  
      register: random_result4

    - name: Execute ACROSSrandom_walk
      shell: kubectl exec -n ddos cgclient12 --  python3 ACROSSrandom_walk.py 1800
      async: 3600 
      poll: 0 
      register: random_result5

    - name: Execute ACROSSrandom_walk
      shell: kubectl exec -n ddos cgclient13 --  python3 ACROSSrandom_walk.py 1800
      async: 3600 
      poll: 0  
      register: random_result6

    - name: Execute ACROSSrandom_walk
      shell: kubectl exec -n ddos cgclient14 --  python3 ACROSSrandom_walk.py 1800
      async: 3600 
      poll: 0 
      register: random_result7



    # ddosclient:
    - name: Execute hping
      shell: kubectl exec -n ddos ddosclient1 -- env ddosserver={{ ddosserver_ip }} /bin/bash -c 'sudo hping3 -c 50 -d 100 -S $ddosserver -w 1232 -p 43 --flood'
      async: 3600 
      poll: 0

    - name: Execute vegeta.sh
      shell: kubectl exec -n ddos ddosclient2 -- env ddosserver={{ ddosserver_ip }} ./vegeta.sh 1800
      async: 3600 
      poll: 0

    - name: Execute dns-amp
      shell: kubectl exec -n ddos ddosclient3 -- env ddosserver={{ ddosserver_ip }} cgserver={{ cgserver_ip }} /bin/bash -c './dns_amp/dns-amp 10.0.24.1 -f domain.txt -t ANY -p 53 -s 10.0.25.1 -S -d 1800'
      async: 3600 
      poll: 0

    - name: Execute doh flood
      shell: kubectl exec -n ddos ddosclient4 -- python3 cne-DoH-master/floodoh.py 30000 www.example.com A https://micaddy.com/dns-query
      async: 3600 
      poll: 0

    - name: Execute quic-flooding.sh
      shell: kubectl exec -n ddos ddosclient5 -- /bin/bash -c './quic-flooding.sh'
      async: 3600 
      poll: 0

    - name: Execute watertorture
      shell: kubectl exec -n ddos ddosclient6 -- env ddosserver={{ ddosserver_ip }} cgserver={{ cgserver_ip }} /bin/bash -c './dns-flood/dnsflood example.com $ddosserver -s $cgserver -p 53 -R -S -d 1800'
      async: 3600 
      poll: 0

    - name: Execute synflood
      shell: kubectl exec -n ddos ddosclient7 -- env ddosserver={{ ddosserver_ip }} /bin/bash -c './synflood-master/build/bin/synflood $ddosserver 80 -i eth1'
      async: 3600 
      poll: 0



    # Waiting tasks
    - name: Waiting
      async_status:
        jid: "{{ item.ansible_job_id }}"
      loop:
        - "{{ youtube_result1 }}"
        - "{{ shorts_result1 }}"
        - "{{ random_result1 }}"
        - "{{ random_result2 }}"
        - "{{ random_result3 }}"
        - "{{ random_result4 }}"
        - "{{ random_result5 }}"
        - "{{ random_result6 }}"
        - "{{ random_result7 }}"
      register: acrossclient_jobs
      until: acrossclient_jobs.finished
      retries: 999
      delay: 15
      ignore_errors: yes

