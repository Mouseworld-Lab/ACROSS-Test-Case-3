---
- name: Topology Undeploy
  hosts: localhost
  gather_facts: no
  vars:
    cgclients: []
    ddosclients: []

  tasks:
#--------------------------------------------Configuration---------------------------------------------------------------------------
    - name: Include client counts
      include_vars:
        file: clients_number.yaml
  
    - name: Crear cgclients
      set_fact:
        cgclients: "{{ cgclients + [{'name': 'cgclient' ~ item, 'pod': 'cgclient' ~ item}] }}"
      loop: "{{ range(1, cg_count + 1)|list }}"
    
    - name: Crear ddosclients
      set_fact:
        ddosclients: "{{ ddosclients + [{'name': 'ddosclient' ~ item, 'pod': 'ddosclient' ~ item}] }}"
      loop: "{{ range(1, ddos_count + 1)|list }}"
      
    - name: Get current date
      command: date +%Y.%m.%d_%H.%M.%S
      register: current_date
      
#--------------------------------------------Save logs---------------------------------------------------------------------------

    - name: Create logs folder with current date
      file:
        path: "~/NDT2/logs_{{ current_date.stdout }}"
        state: directory

    # - name: Definir directorio monitorizado
    #   set_fact:
    #     directorio_monitorizado: "~/NDT2/logs_{{ current_date.stdout }}"

    # - name: Monitoring ssh transfer script
    #   shell: python3 /home/mw/mw_deployment/deployment-kne/prueba.py --directorio-monitorizado "{{ directorio_monitorizado }}"
    #   async: 999999999 
    #   poll: 0

    
    - name: Copy logs folder cgclients
      shell: "kubectl -n ddos cp {{ item.pod }}:/home/cognet/logs ~/NDT2/logs_{{ current_date.stdout }}/{{ item.name }}_logs"
      loop: "{{ cgclients }}"
      ignore_errors: yes
      async: 3600 
      poll: 0
      register: copylogcgclient_result 

    - name: Copy logs folder ddosclients
      shell: "kubectl -n ddos cp {{ item.pod }}:/home/cognet/logs ~/NDT2/logs_{{ current_date.stdout }}/{{ item.name }}_logs"
      loop: "{{ ddosclients }}"
      ignore_errors: yes
      async: 3600 
      poll: 0
      register: copylogddosclient_result 
      
    - name: Copy logs folder cgserver
      shell: "kubectl -n ddos cp cgserver:/home/cognet/logs ~/NDT2/logs_{{ current_date.stdout }}/cgserver_logs"
      ignore_errors: yes
      async: 3600 
      poll: 0
      register: copylogserver_result 
      
    - name: Copy logs folder ddosserver
      shell: "kubectl -n ddos cp ddosserver:/home/cognet/logs ~/NDT2/logs_{{ current_date.stdout }}/ddosserver_logs"
      ignore_errors: yes
      async: 3600 
      poll: 0
      register: copylogddosserver_result


    - name: Stop PCAPs
      shell: "kubectl -n ddos exec {{ item.pod }} -- pkill tcpdump"
      loop:
        - { pod: "ceos1" }
        - { pod: "ceos2" }
        - { pod: "ceos3" }
        - { pod: "ceos4" }
        - { pod: "ceos5" }
        - { pod: "ceos6" }
        - { pod: "ceos7" }
        - { pod: "ceos11" }
        - { pod: "ceos12" }
        - { pod: "ceos13" }
        
      ignore_errors: yes
      async: 60
      poll: 0
      
      
    - name: Finishing copying logs
      async_status: 
        jid: "{{ item.ansible_job_id }}"
      loop: "{{ (copylogcgclient_result.results | default([])) + (copylogddosclient_result.results | default([])) + (copylogserver_result.results | default([])) + (copylogddosserver_result.results | default([])) }}"
      register: acrossclient_jobs
      until: acrossclient_jobs.finished
      retries: 999
      delay: 15
      ignore_errors: yes
      

    - name: Copy logs folder ceos 
      shell: "kubectl -n ddos cp {{ item.pod }}:/home/{{ item.pod }}_{{ item.interface }}.pcap ~/NDT2/logs_{{ current_date.stdout }}/{{ item.pod }}_{{ item.interface }}.pcap"
      loop:
        - { pod: "ceos11", interface: "eth4" }
        - { pod: "ceos11", interface: "eth1" }
        - { pod: "ceos11", interface: "eth2" }
        - { pod: "ceos11", interface: "eth3" }
        - { pod: "ceos11", interface: "eth5" }
        - { pod: "ceos11", interface: "eth6" }
        - { pod: "ceos11", interface: "eth7" }
        - { pod: "ceos11", interface: "eth8" }
        - { pod: "ceos11", interface: "eth9" }
        - { pod: "ceos11", interface: "eth10" }
        - { pod: "ceos11", interface: "eth11" }
        - { pod: "ceos11", interface: "eth12" }
        - { pod: "ceos11", interface: "eth13" }
        - { pod: "ceos11", interface: "eth14" }
        - { pod: "ceos11", interface: "eth15" }
        - { pod: "ceos11", interface: "eth16" }
        - { pod: "ceos11", interface: "eth17" }
        - { pod: "ceos11", interface: "eth18" }
        - { pod: "ceos11", interface: "eth19" }
        - { pod: "ceos11", interface: "eth20" }
        - { pod: "ceos11", interface: "eth21" }
        - { pod: "ceos11", interface: "eth22" }
        - { pod: "ceos11", interface: "eth23" }
        - { pod: "ceos13", interface: "eth1" }
        - { pod: "ceos13", interface: "eth2" }
        - { pod: "ceos13", interface: "eth3" }
        - { pod: "ceos13", interface: "eth4" }
        - { pod: "ceos13", interface: "eth5" }
        - { pod: "ceos13", interface: "eth6" }
        - { pod: "ceos13", interface: "eth7" }
        - { pod: "ceos13", interface: "eth8" }
        - { pod: "ceos13", interface: "eth9" }
        - { pod: "ceos13", interface: "eth10" }
        - { pod: "ceos13", interface: "eth11" }
        - { pod: "ceos1", interface: "eth2" }
        - { pod: "ceos1", interface: "eth3" }
        - { pod: "ceos1", interface: "eth4" }
        - { pod: "ceos1", interface: "eth5" }
        - { pod: "ceos2", interface: "eth1" }
        - { pod: "ceos2", interface: "eth2" }
        - { pod: "ceos2", interface: "eth3" }
        - { pod: "ceos2", interface: "eth4" }
        - { pod: "ceos2", interface: "eth5" }
        - { pod: "ceos3", interface: "eth1" }
        - { pod: "ceos3", interface: "eth2" }
        - { pod: "ceos3", interface: "eth3" }
        - { pod: "ceos3", interface: "eth4" }
        - { pod: "ceos3", interface: "eth5" }
        - { pod: "ceos4", interface: "eth2" }
        - { pod: "ceos4", interface: "eth3" }
        - { pod: "ceos4", interface: "eth4" }
        - { pod: "ceos6", interface: "eth2" }
        - { pod: "ceos6", interface: "eth3" }
        - { pod: "ceos6", interface: "eth4" }
        - { pod: "ceos5", interface: "eth2" }
        - { pod: "ceos5", interface: "eth3" }
        - { pod: "ceos7", interface: "eth2" }
        - { pod: "ceos7", interface: "eth3" }
        - { pod: "ceos7", interface: "eth4" }
        - { pod: "ceos12", interface: "eth2" }
        - { pod: "ceos12", interface: "eth4" }
      retries: 10
      delay: 10
      ignore_errors: yes
  
    

#--------------------------------------------Undeploy kne---------------------------------------------------------------------------
    - name: Undeploy topology
      shell: kne delete ~/oldk8controller/k8cont/kne/examples/arista/UPM/10ceos_24cg_20dd_10ceos_rev4/TopologiaB5gemini.yaml
      ignore_errors: yes
      
