---
- name: Execute task in pods
  hosts: localhost
  gather_facts: no
  vars:
    cgclients: []
    ddosclients: []

  tasks:
#--------------------------------------Configuration------------------------------------------------------------------------------------
    - name: Include client counts
      include_vars:
        file: "{{ playbook_dir }}/../clients_number.yaml"
  
    - name: Crear cgclients
      set_fact:
        cgclients: "{{ cgclients + [{'name': 'cgclient' ~ item, 'pod': 'cgclient' ~ item}] }}"
      loop: "{{ range(1, cg_count + 1)|list }}"
    
    - name: Crear ddosclients
      set_fact:
        ddosclients: "{{ ddosclients + [{'name': 'ddosclient' ~ item, 'pod': 'ddosclient' ~ item}] }}"
      loop: "{{ range(1, ddos_count + 1)|list }}"
    
    - name: Include server IPs
      include_vars:
        file: "{{ playbook_dir }}/../server_ips.yaml"

    - name: Debug loaded server IPs
      debug:
        var: ddosserver_ip

    - name: Debug loaded server IPs
      debug:
        var: cgserver_ip



#---------------------------------Tasks execution---------------------------------------------------------------------------------------
    # Cglient:

    - name: Execute file_transfer wget
      shell: kubectl exec -n ddos cgclient1 -- timeout 660 python3 ACROSSfile_transfer.py https://planet.openstreetmap.org/planet/planet-latest.osm.bz2 14M
      async: 3600 
      poll: 0

    - name: Execute file_transfer_scp_elephant
      shell: kubectl exec -n ddos cgclient2 -- env cgserver={{ cgserver_ip }} timeout 660 python3 ACROSSfile_transfer_scp_elephant.py 112000
      async: 3600 
      poll: 0

    - name: Execute ACROSSconsuming_video.py
      shell: kubectl exec -n ddos cgclient3 -- python3.7 ACROSSconsuming_video.py https://www.twitch.tv/hitsquadgodfather 660 #set time and url
      async: 3600 
      poll: 0
      register: twitch_result1

    - name: Execute ACROSSconsuming_video.py
      shell: kubectl exec -n ddos cgclient4 -- python3.7 ACROSSconsuming_video.py https://www.twitch.tv/hitsquadgodfather 660 #set time and url
      async: 3600 
      poll: 0
      register: twitch_result2

    - name: Execute shorts
      shell: kubectl exec -n ddos cgclient5 -- python3.7 ACROSSshorts.py 660
      async: 3600 
      poll: 0
      register: shorts_result1

    - name: Execute shorts
      shell: kubectl exec -n ddos cgclient6 -- python3.7 ACROSSshorts.py 660
      async: 3600 
      poll: 0
      register: shorts_result2

    - name: Execute ACROSSfile_transfer_scp_chetaah
      shell: kubectl exec -n ddos cgclient7 -- env cgserver={{ cgserver_ip }} timeout 660 python3 ACROSSfile_transfer_scp_cheetah.py 160000
      async: 3600 
      poll: 0

    - name: Execute aria2c
      shell: kubectl exec -n ddos cgclient8 -- timeout 660 aria2c --disable-ipv6=true --max-upload-limit=100 --max-download-limit=15M https://planet.openstreetmap.org/planet/planet-latest.osm.bz2.torrent
      async: 3600 
      poll: 0

    - name: Execute nc listener
      shell: kubectl exec -n ddos cgserver -- nc -l -p 20345 > /dev/null &
    - name: Execute send_data_elephant
      shell: kubectl exec -n ddos cgclient9 -- env cgserver={{ cgserver_ip }} python3 send_datta_elephant.py 20345 660
      async: 3600 
      poll: 0

    - name: Execute ACROSSconsuming_video.py
      shell: kubectl exec -n ddos cgclient10 -- python3.7 ACROSSconsuming_video.py https://www.twitch.tv/videos/2274922101 660 #set time and url
      async: 3600 
      poll: 0
      register: twitch_result3

    - name: Execute ACROSSconsuming_video.py
      shell: kubectl exec -n ddos cgclient11 -- python3.7 ACROSSconsuming_video.py https://www.twitch.tv/videos/2274922101 660 #set time and url
      async: 3600 
      poll: 0
      register: twitch_result4

    

    # Waiting tasks
    - name: Waiting
      async_status:
        jid: "{{ item.ansible_job_id }}"
      loop:
        - "{{ twitch_result1 }}"
        - "{{ twitch_result2 }}"
        - "{{ twitch_result3 }}"
        - "{{ twitch_result4 }}"
        - "{{ shorts_result1 }}"
        - "{{ shorts_result2 }}"
      register: acrossclient_jobs
      until: acrossclient_jobs.finished
      retries: 999
      delay: 15
      ignore_errors: yes

