---
- name: Execute task in pods
  hosts: localhost
  gather_facts: no
  vars:
    cgclients: []
    ddosclients: []

  tasks:
#--------------------------------------Configuration------------------------------------------------------------------------------------
    - name: Include client counts
      include_vars:
        file: "{{ playbook_dir }}/../clients_number.yaml"
  
    - name: Crear cgclients
      set_fact:
        cgclients: "{{ cgclients + [{'name': 'cgclient' ~ item, 'pod': 'cgclient' ~ item}] }}"
      loop: "{{ range(1, cg_count + 1)|list }}"
    
    - name: Crear ddosclients
      set_fact:
        ddosclients: "{{ ddosclients + [{'name': 'ddosclient' ~ item, 'pod': 'ddosclient' ~ item}] }}"
      loop: "{{ range(1, ddos_count + 1)|list }}"
    
    - name: Include server IPs
      include_vars:
        file: "{{ playbook_dir }}/../server_ips.yaml"

    - name: Debug loaded server IPs
      debug:
        var: ddosserver_ip

    - name: Debug loaded server IPs
      debug:
        var: cgserver_ip



#---------------------------------Tasks execution---------------------------------------------------------------------------------------
    # Cglient:

    - name: Execute ACROSSrandom_walk
      shell: kubectl exec -n ddos cgclient1 -- python3.7 ACROSSrandom_walk.py 660
      async: 3600 
      poll: 0 
      register: random_result1

    - name: Execute ACROSSrandom_walk
      shell: kubectl exec -n ddos cgclient2 -- python3.7 ACROSSrandom_walk.py 660
      async: 3600 
      poll: 0 
      register: random_result2

    - name: Execute file_transfer_wget
      shell: kubectl exec -n ddos cgclient3 -- timeout 660 python3 ACROSSfile_transfer.py https://dumps.wikimedia.org/enwiki/latest/enwiki-latest-stub-meta-history.xml.gz 400K
      async: 3600 
      poll: 0

    - name: Execute file_transfer_wget
      shell: kubectl exec -n ddos cgclient4 -- timeout 660 python3 ACROSSfile_transfer.py https://dumps.wikimedia.org/enwiki/latest/enwiki-latest-stub-meta-history.xml.gz 400K
      async: 3600 
      poll: 0

    - name: Execute file_transfer_scp_elephant
      shell: kubectl exec -n ddos cgclient5 -- env cgserver={{ cgserver_ip }} timeout 660 python3 ACROSSfile_transfer_scp_elephant.py 16000
      async: 3600 
      poll: 0

    - name: Execute file_transfer_scp_elephant
      shell: kubectl exec -n ddos cgclient6 -- env cgserver={{ cgserver_ip }} timeout 660 python3 ACROSSfile_transfer_scp_elephant.py 16000
      async: 3600 
      poll: 0

    - name: Execute benign dns request (dig)
      shell: kubectl exec -n ddos cgclient7 -- ./ACROSSrand_dig.sh 660
      async: 3600 
      poll: 0

    - name: Execute benign dns request (dig)
      shell: kubectl exec -n ddos cgclient8 -- ./ACROSSrand_dig.sh 660
      async: 3600 
      poll: 0
    
    - name: Execute ACROSSconsuming_video_YT.py
      shell: kubectl exec -n ddos cgclient9 -- python3.7 ACROSSconsuming_video_YT.py https://www.youtube.com/watch?v=wnhvanMdx4s 660 #set time and url
      async: 3600 
      poll: 0
      register: youtube_result1

    - name: Execute ACROSSconsuming_video_YT.py
      shell: kubectl exec -n ddos cgclient10 -- python3.7 ACROSSconsuming_video_YT.py https://www.youtube.com/watch?v=wnhvanMdx4s 660 #set time and url
      async: 3600 
      poll: 0
      register: youtube_result2

    

    # Waiting tasks
    - name: Waiting
      async_status:
        jid: "{{ item.ansible_job_id }}"
      loop:
        - "{{ youtube_result1 }}"
        - "{{ youtube_result2 }}"
        - "{{ random_result1 }}"
        - "{{ random_result2 }}"
      register: acrossclient_jobs
      until: acrossclient_jobs.finished
      retries: 999
      delay: 15
      ignore_errors: yes

